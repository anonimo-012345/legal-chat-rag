<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro — Assistente Jurídico</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h1>Criar conta</h1>
            <p class="subtitle">Leva menos de um minuto</p>

            <form id="register-form">
                <div class="field">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" minlength="3" autocomplete="username" required>
                </div>
                <div class="field">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" minlength="6" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn" id="submit-btn">Cadastrar</button>
                <p class="error-msg" id="error-msg"></p>
            </form>

            <p class="switch-link">Já tem conta? <a href="/login">Entrar</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById("register-form");
        const errorMsg = document.getElementById("error-msg");
        const submitBtn = document.getElementById("submit-btn");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorMsg.textContent = "";
            submitBtn.disabled = true;
            submitBtn.textContent = "Cadastrando...";

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                const res = await fetch("/api/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password }),
                });

                if (!res.ok) {
                    const data = await res.json();
                    throw new Error(data.detail || "Erro ao cadastrar");
                }

                window.location.href = "/chat";
            } catch (err) {
                errorMsg.textContent = err.message;
                submitBtn.disabled = false;
                submitBtn.textContent = "Cadastrar";
            }
        });
    </script>
</body>
</html>
